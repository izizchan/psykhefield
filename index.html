<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PsykheField</title>
<style>
 :root{color-scheme:light dark}
 body{font-family:system-ui,sans-serif;margin:0;padding:1.5rem;max-width:52rem;
      margin-inline:auto;line-height:1.7}
 h1{font-size:1.5rem;margin:0 0 .2rem}
 h2{font-size:1.05rem;margin:2rem 0 .4rem;border-bottom:1px solid #8884;padding-bottom:.2rem}
 .lead{color:#888;margin:.2rem 0 1rem;font-size:.9rem}
 .none{color:#888;font-size:.85rem;margin:.2rem 0}
 .go{display:inline-block;border:1px solid #8886;border-radius:.3rem;
     padding:.5rem 1rem;text-decoration:none;color:inherit;margin:.3rem .4rem .3rem 0}
 .go.primary{border-color:#2b8;color:#2b8;font-weight:600}
 code{background:#8882;padding:.1rem .3rem;border-radius:.2rem;font-size:.85rem}
 .ver{font-size:.85rem;color:#888;margin-left:.4rem}
</style>
</head>
<body>

<h1>PsykheField</h1>
<p class="lead">マルチプレイヤー対戦アクションのクライアント配布ページ。<strong>非公開の個人プロジェクト。</strong></p>

<h2>クライアント（Windows）</h2>
<p>
  <a class="go primary" href="PsykheField.exe" id="exe">PsykheField.exe をダウンロード</a>
  <span class="ver" id="ver"></span>
</p>
<p class="none">クライアントは起動時にこのページの <code>latest.json</code> を見て、新しい版があれば
自分で取ってきて入れ替わる（設定不要）。</p>

<script>
fetch('latest.json?t=' + Date.now())
  .then(r => r.json())
  .then(j => {
    document.getElementById('ver').textContent =
      'v' + j.versionName + '（' + (j.releasedAt || '') + '）' +
      (j.serverVersion ? ' / server v' + j.serverVersion : '');
    if (j.exe) document.getElementById('exe').href = j.exe;
  })
  .catch(() => {});
</script>
</body>
</html>
